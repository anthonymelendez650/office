services:
  api:
    build: ./backend
    environment:
      OFFICE_DATABASE_PATH: /app/data/office.sqlite3
      OFFICE_AUTH_REQUIRED: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data

  frontend:
    image: node:22.13-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_DEMO_MODE: "false"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - office_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  office_node_modules:
