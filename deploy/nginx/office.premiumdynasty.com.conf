limit_req_zone $binary_remote_addr zone=office_mcp:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name office.premiumdynasty.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name office.premiumdynasty.com;

    ssl_certificate /etc/letsencrypt/live/office.premiumdynasty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/office.premiumdynasty.com/privkey.pem;

    client_max_body_size 16m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/office-proxy-auth.conf;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    location = /_office_mcp_auth {
        internal;
        auth_basic off;
        proxy_pass http://127.0.0.1:8000/api/auth/mcp;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Office-Proxy-Token "";
        proxy_set_header X-Office-User "";
        proxy_set_header X-Office-Scopes "";
    }

    # Public MCP transport. The auth subrequest validates a connection-only token in SQLite.
    location = /mcp {
        auth_basic off;
        auth_request /_office_mcp_auth;
        limit_req zone=office_mcp burst=20 nodelay;
        proxy_pass http://127.0.0.1:8010/mcp;
        proxy_http_version 1.1;
        # The MCP SDK permits loopback Host values when bound to loopback.
        proxy_set_header Host 127.0.0.1:8010;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no" always;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # MCP and other service clients authenticate with a scoped Office bearer token.
    location /mcp/api/ {
        auth_basic off;
        limit_req zone=office_mcp burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Office-Proxy-Token "";
        proxy_set_header X-Office-User "";
        proxy_set_header X-Office-Scopes "";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # ---- Office sign-in gate: session cookie validated by backend subrequest ----
    location = /signin {
        return 302 /signin.html;
    }

    location = /signin/ {
        return 302 /signin.html;
    }

    location = /signin.html {
        alias /opt/webapps/sites/office/deploy/nginx/signin/index.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    # Sign-in endpoints stay reachable without a session (backend validates).
    location = /api/auth/login {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Office-Proxy-Token "";
        proxy_set_header X-Office-User "";
        proxy_set_header X-Office-Scopes "";
    }

    location = /api/auth/logout {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Office-Proxy-Token "";
        proxy_set_header X-Office-User "";
        proxy_set_header X-Office-Scopes "";
    }

    location = /api/auth/session {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Office-Proxy-Token "";
        proxy_set_header X-Office-User "";
        proxy_set_header X-Office-Scopes "";
    }

    # Session-validation subrequest for the frontend gate.
    location = /_office_session_auth {
        internal;
        auth_basic off;
        proxy_pass http://127.0.0.1:8000/api/auth/session;
        proxy_http_version 1.1;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Office-Proxy-Token "";
        proxy_set_header X-Office-User "";
        proxy_set_header X-Office-Scopes "";
        proxy_set_header Authorization "";
        proxy_intercept_errors on;
        error_page 301 302 303 307 308 = @_office_no_session;
        error_page 401 = @_office_no_session;
    }

    location @_office_no_session {
        return 401;
    }

    location @_office_signin {
        return 302 /signin/;
    }

    location / {
        auth_request /_office_session_auth;
        error_page 401 = @_office_signin;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
